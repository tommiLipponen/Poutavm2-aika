# Mosquitto MQTT Broker Configuration
# For TimeApp MQTT Chat Integration

# MQTT TCP listener (internal use)
listener 1883
protocol mqtt

# WebSocket listener (for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (for development/education)
# For production, configure authentication:
# password_file /mosquitto/config/passwd
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence - save messages to disk
persistence true
persistence_location /mosquitto/data/

# Autosave interval (seconds)
autosave_interval 300

# Quality of Service
max_queued_messages 1000
