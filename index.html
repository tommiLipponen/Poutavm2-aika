<!DOCTYPE html>
<html lang="fi-FI">
<head>
    <title>Personoitu Sivuni!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="db-time">Aika latautuu...</h1>
    </header>
    <section>
        <h2>Stackin kuvaus</h2>
        <p>Tämä palvelin käyttää seuraavanlaista pinoa: Linux, Nginx, PostgreSQL ja Python (Flask).</p>
    </section>
    <footer>
        <p>Powered by CSC cPouta</p>
    </footer>
    <script>
        async function fetchTime() {
            const response = await fetch('/time');
            const data = await response.json();
            document.getElementById('db-time').textContent = data.time;
        }
        fetchTime();
        setInterval(fetchTime, 5000);
    </script>
</body>
</html>
