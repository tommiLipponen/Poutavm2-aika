<!DOCTYPE html>
<html lang="fi-FI">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personoitu Sivuni!!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0078D7;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
        }

        section {
            padding: 20px;
            background: white;
            margin: 20px auto;
            width: 80%;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="db-time">Aika latautuu...</h1>
    </header>
    <section>
        <h2>Stackin kuvaus</h2>
        <p>Tämä palvelin käyttää seuraavanlaista pinoa: Linux, Nginx, PostgreSQL ja Python (Flask).</p>
    </section>
    <footer>
        <p>Powered by CSC cPouta</p>
    </footer>
    <script>
        async function fetchTime() {
            const response = await fetch('/time');
            const data = await response.json();
            document.getElementById('db-time').textContent = data.time;
        }
        fetchTime();
        setInterval(fetchTime, 5000);
    </script>
</body>
</html>
