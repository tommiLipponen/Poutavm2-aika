[metadata]
name = timeapp
version = 1.0.0
description = A Flask-based time and analytics application
author = OAMK Student
license = MIT
platforms = any
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Flask
    Intended Audience :: Education
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
packages = find:
python_requires = >=3.8
install_requires =
    Flask>=3.0.0
    psycopg2-binary>=2.9.9
    python-dotenv>=1.0.0
    gunicorn>=21.2.0

[options.packages.find]
exclude =
    tests*
    docs*
    infra*

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
